<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-image: linear-gradient(#8fa0c6 , #E4EfE9);" >
    <h1 style="text-align: center;">Student Registration  Form</h1>
  
    <div>
       
           
        <form action="" style="margin-left: 20px;">
            <h4>Student Name</h4>
            <input type="text" name="" id="name" placeholder="full Name">

            <h4>Adress</h4>
            <input type="text" name="" id="adress" placeholder="Street Adress ">
            <br>

            <br>
            
            
            <input type="text" name="" id="s-adress" placeholder="Street Adress Line 2">
            <br>
            
            <br>
             <select name="city" id="cite" defaultValue=""  required>
                <option value="" hidden>select country</option>
            <option value="karachi">karachi</option>
            <option value="Lahore">Lahore</option>
            <option value="Islamabad">Islamabad</option>
            <option value="pishawar">pishawar</option>
            </select>
            <input type="text" name="" id="region" placeholder="Region">

            <br><br>

            <input type="email" name="" id="email" placeholder="Email">
            <input type="tel" name="" id="tel" placeholder="Mobile No">
             
            <h4>Gender</h4>
            <input type="radio" name="gender" id="Male" ><label for="Male" >Male</label>
            <input type="radio" name="gender" id="Female" ><label for="Female">Female</label>

            
            <h4>Department</h4>
            <input type="checkbox" name="Department" id="BSSE"><label for="BSSE">BS(SE)</label>
            <input type="checkbox" name="Department" id="BSCS"><label for="BSCS">BS(CS)</label>
            <input type="checkbox" name="Department" id="BESE"><label for="BESE">BE(SE)</label>
            <input type="checkbox" name="Department" id="BBA"><label for="BBA">BBA</label>
            <br><br>
            
           
            <textarea name="" id="area" placeholder="Why you chose that field"></textarea>
            <br>
            <br>
            <input type="file" name="" id="image">
            <br><br>

            <button id="submit"><a href="./submit.html" style="text-decoration: none;color: black;">submit</a></button>
            <input type="reset" name="" id="reset">
        

        </form>

      
    </div>
</body>
</html>
