<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
   
    <title>Promotion Table</title>
    <style>
        body{
    background-color:black;
}

.container{
    background-color: lightslategray;
    border: 5px groove white;
    width: 900px;
    height:450px ;
    margin: auto;
    margin-top: 60px;
    padding-top: 70px;
    box-shadow: 5px 5px 20px whitesmoke;
}

h1{
    text-align: center;
    color: white;
}

table{
    border: 2px solid white;
    width: 750px;
    height: 320px;
    margin: auto;
    border-collapse:collapse;
    text-align: center;


}

th,td{
    border: 2px solid white;
   
 
}

button{
    color: white;
    background-color: red;
    border: 1px solid black;
    border-radius: 10px;
    box-shadow: 2px 2px 5px white;
    cursor: pointer;
}
    </style>
</head>
<body>
    <div class="container">
        <h1>Promotion Plans</h1>
        <table >
            <tr >
                <th style="background-color: beige;">COMPAIR ALL PLANS</th>
                <th style="background-color: orange; color: white;">STARTERS</th>
                <th style="background-color: red; color: white;">ADVANCE</th>
                <th style="background-color: lightskyblue; color: white;">ENTERPRISE</th>
            </tr>

            <tr style="color: white;">
                <td>1st Month Management Cost</td>
                <td>$400</td>
                <td>$900</td>
                <td>$1200</td>
            </tr>

            <tr>
                <td style="color: white;">Following Month</td>
                <td style="font-size: 20px;color: yellow;">$300</td>
                <td style="font-size: 20px;color: red;">$700</td>
                <td style="font-size: 20px;color: lightskyblue;">$900</td>
            </tr>

            <tr style="color: white;">
                <td>Delivery Time Frame</td>
                <td>3-6 Months</td>
                <td>3-6 Months</td>
                <td>3-6 Months</td>
            </tr>

            <tr>
                <td style="color: white;">Support 24/7</td>
                <td style="color: white;">-</td>
                <td style="font-size: 20px;color: yellow;">&#10003;</td>
                <td style="font-size: 20px;color: yellow;">&#10003;</td>
            </tr>

            <tr>
                <td style="color: white;">Certificate</td>
                <td style="color: white;">-</td>
                <td style="font-size: 20px;color: yellow;">&#10003;</td>
                <td style="font-size: 20px;color: yellow;">&#10003;</td>
            </tr>

            <tr>
                <td style="color: white;">Guranted Keywords Ranking in <br> First Page of Google</td>
                <td style="color: white;">18</td>
                <td style="color: white;">20</td>
                <td style="color: white;">28</td>
            </tr>

            <tr>
                <td></td>
                <td><button>Buy Now</button></td>
                <td><button>Buy Now</button></td>
                <td><button>Buy Now</button></td>
            </tr>
        </table>
    </div>
</body>
</html>
