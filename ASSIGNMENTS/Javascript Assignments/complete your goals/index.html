<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daily rutine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">
        <div id="main">
            <h1 style="color:#48a300 ;">Focus on<span style="color: #61481c;">  Today</span></h1>
            <div id="child">
                <h3>Today☀️</h3>
                <p style="color: lightgray;" class="raisebartext">Raise the bar by completing your goal</p>
                <div id="raisebar">
                    <div class="completing"></div>
                </div>
                <p id="showerror"></p>
                <div class="inp1">
                    <input type="checkbox" name="" id="" class="radio">
                    <input type="text" id="first" class="inptext" placeholder="Add task...">
                </div>
                <div class="inp1">
                   <input type="checkbox" name="" id="" class="radio">
                    <input type="text" id="second"  class="inptext"  placeholder="Add task...">
                </div>
                <div class="inp1">
                   <input type="checkbox" name="" id="" class="radio">
                    <input type="text" id="third"  class="inptext"  placeholder="Add task...">
                </div>
                 <div class="message">
                <h3>" Move one step a head today! "</h3>
                </div>

                <div class="madeby">
                    <h6>Designed & Developed by Shahid Ahmed</h6>
                </div>
            </div>
        </div>
    </div>
    



    <script src="app.js"></script>
</body>
</html>
