<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="child1">
         <input type="text" id="input">
        </div>


        <div class="child2">
            <div class="row1">
                <button id="clear" class="clear" onclick="clearall()">C</button>
                <button id="butt1" onclick="button1()">1</button>
                <button id="butt2" onclick="button2()">2</button>
                
            </div>

             <div class="row2">
                <button id="buttton-plus" class="gray" onclick="button_plus()">+</button>
                <button id="butt3"  onclick="button3()">3</button>
                <button id="butt4" onclick="button4()">4</button>
                
            </div>

              <div class="row3">
                <button id="button-minus" class="gray" onclick="button_minus()">-</button>
                <button id="butt5" onclick="button5()">5</button>
                <button id="butt6" onclick="button6()">6</button>
                
            </div>

             <div class="row4">
                <button id="buttonmul" class="gray" onclick="button_multiply()">*</button>
                <button id="butt7"  onclick="button7()">7</button>
                <button id="butt8" onclick="button8()">8</button>
                
            </div>

              <div class="row5">
                <button id="buttondiv" class="gray" onclick="button_divide()">/</button>
                <button id="buttequal" onclick="equal()">=</button>
                <button id="butt9"  onclick="button9()">9</button>
                
            </div>

            <div class="row6">
                <button id="butt0" onclick="button0()">0</button>
                <button id="buttdot"  onclick="buttondot()">.</button>
              
                
            </div>
           
           
        
    </div>


    <script src="app.js"></script>
</body>
</html>
